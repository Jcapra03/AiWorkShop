# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
#
# Hermes Agent on Render — private background worker.
# https://github.com/NousResearch/hermes-agent
#
# Runs the Hermes gateway (messaging + cron scheduler) as a Render
# background worker: no public URL and no web dashboard, so nothing is
# exposed to the internet. You talk to the agent over Telegram, locked
# to your own Telegram user ID.
#
# Because there is no dashboard, all keys are set as Render environment
# variables (Render env vars override /opt/data/.env at process start).
# Persistent state (config, sessions, memory, skills) lives on the disk.
#
# To upgrade Hermes: bump HERMES_IMAGE in the Dockerfile and redeploy.
# To upgrade Render skills: bump RENDER_SKILLS_REF and redeploy.

services:
  - type: worker
    name: hermes-worker
    runtime: docker
    region: oregon
    plan: standard
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: off

    disk:
      name: hermes-data
      mountPath: /opt/data
      sizeGB: 5

    envVars:
      # No dashboard: the gateway is the only process.
      - key: HERMES_DASHBOARD
        value: "0"

      # Only used if you later enable the OpenAI-compatible API server.
      - key: HERMES_GATEWAY_TOKEN
        generateValue: true

      # --- Secrets: you fill these in when you apply the Blueprint ---

      # LLM provider. OpenRouter key — set a credit limit on it at
      # https://openrouter.ai/keys
      - key: OPENROUTER_API_KEY
        sync: false

      # Telegram bot token from @BotFather.
      - key: TELEGRAM_BOT_TOKEN
        sync: false

      # Your numeric Telegram user ID (from @userinfobot). Only these
      # IDs can talk to the agent. Comma-separate to add more.
      - key: TELEGRAM_ALLOWED_USERS
        sync: false

      # Optional: lets the agent inspect/manage Render via the Render MCP
      # server. Use a key from a LOW-PRIVILEGE Render account, or leave
      # blank to skip. https://dashboard.render.com/u/*/settings#api-keys
      - key: RENDER_MCP_API_KEY
        sync: false
